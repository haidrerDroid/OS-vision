<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="OSVision banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#031023" />
      <stop offset="1" stop-color="#073b3b" />
    </linearGradient>

    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#00d4c2" />
      <stop offset="1" stop-color="#0ea5a6" />
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity="0.45" />
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#07202a" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" rx="12"/>
  <rect width="100%" height="100%" fill="url(#grid)" opacity="0.08" rx="12"/>

  <!-- Left logo: stylized chip + OS letters -->
  <g transform="translate(48,40)" filter="url(#softShadow)">
    <rect x="0" y="0" width="160" height="160" rx="20" fill="#071226" stroke="url(#accent)" stroke-width="1.5"/>

    <!-- chip pins -->
    <g fill="#0ea5a6" opacity="0.95">
      <rect x="-8" y="22" width="8" height="6" rx="2"/>
      <rect x="-8" y="52" width="8" height="6" rx="2"/>
      <rect x="160" y="22" width="8" height="6" rx="2"/>
      <rect x="160" y="52" width="8" height="6" rx="2"/>
      <rect x="22" y="-8" width="6" height="8" rx="2"/>
      <rect x="52" y="-8" width="6" height="8" rx="2"/>
      <rect x="22" y="160" width="6" height="8" rx="2"/>
      <rect x="52" y="160" width="6" height="8" rx="2"/>
    </g>

    <!-- inner chip and OS letters -->
    <rect x="20" y="20" width="120" height="120" rx="12" fill="#02182a" />
    <g transform="translate(36,36)">
      <text x="0" y="46" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="48" fill="#00ffd8" font-weight="700">OS</text>
      <text x="0" y="88" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="14" fill="#7ef0e0">Vision</text>
    </g>
  </g>

  <!-- Title and subtitle -->
  <g transform="translate(240,54)">
    <text x="0" y="38" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="64" fill="#ffffff" font-weight="700">OSVision</text>
    <text x="0" y="80" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" fill="#bfeee8">Visualize · Simulate · Understand Operating Systems</text>

    <!-- small decorative timeline (Gantt-style) -->
    <g transform="translate(0,110)">
      <rect x="0" y="0" width="460" height="14" rx="7" fill="#05282f" />
      <rect x="6" y="2" width="86" height="10" rx="5" fill="url(#accent)"/>
      <rect x="110" y="2" width="52" height="10" rx="5" fill="#0fb7a9" opacity="0.95"/>
      <rect x="182" y="2" width="120" height="10" rx="5" fill="#3dd6c2" opacity="0.9"/>
      <rect x="312" y="2" width="36" height="10" rx="5" fill="#16a085" opacity="0.85"/>
      <rect x="358" y="2" width="92" height="10" rx="5" fill="#0ea5a6" opacity="0.8"/>
    </g>
  </g>

  <!-- Right badge: version + icons -->
  <g transform="translate(952,34)">
    <rect x="0" y="0" width="196" height="72" rx="12" fill="#00121a" opacity="0.18" />
    <g transform="translate(14,18)">
      <text x="0" y="20" font-family="Segoe UI, Roboto, Arial, sans-serif" font-size="18" fill="#e6fff9">v1.0 — Demo</text>
      <!-- mini icons: cpu and chart -->
      <g transform="translate(0,34)">
        <rect x="0" y="0" width="34" height="20" rx="4" fill="#06242a" stroke="#0fb7a9" stroke-width="1"/>
        <rect x="44" y="0" width="56" height="20" rx="4" fill="#06242a" stroke="#16a085" stroke-width="1"/>
        <rect x="106" y="0" width="56" height="20" rx="4" fill="#06242a" stroke="#0ea5a6" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- subtle shimmer line -->
  <rect x="0" y="0" width="1200" height="1" fill="#0ff" opacity="0.02"/>
</svg>
