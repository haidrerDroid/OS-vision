<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-label="OSVision banner">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#061220"/>
      <stop offset="1" stop-color="#073b3b"/>
    </linearGradient>
    <linearGradient id="accent" x1="720" y1="53" x2="1050" y2="319" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7FFFD4"/>
      <stop offset="1" stop-color="#0ea5a6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(160 154 -154 160 933 185)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00ffd8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00ffd8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="rgba(255,255,255,0.02)"/>

  <!-- decorative waves -->
  <path d="M0 280C160 230 340 320 520 280c160-36 240-106 400-78 120 22 200 6 280-34v132H0v-120Z" fill="#0f3f3f" fill-opacity="0.14"/>
  <path d="M0 306c150-30 300 10 470-12 200-28 300-96 470-68 90 16 170 6 260-26v156H0v-56Z" fill="#0ea5a6" fill-opacity="0.06"/>

  <!-- right circular tech motif -->
  <g transform="translate(820,50)">
    <circle cx="140" cy="140" r="120" fill="url(#glow)"/>
    <circle cx="140" cy="140" r="94" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.6"/>
    <circle cx="140" cy="140" r="60" stroke="url(#accent)" stroke-width="1.6" stroke-opacity="0.9"/>
    <g transform="translate(140,140)">
      <rect x="-34" y="-34" width="68" height="68" rx="8" fill="#021726" stroke="#12d7c3" stroke-width="1" opacity="0.95"/>
      <path d="M-18 -6h36v12h-36z" fill="#0ff" opacity="0.14"/>
      <circle r="6" fill="#e6fff9"/>
    </g>
    <!-- subtle spokes -->
    <g stroke="#9ff1e6" stroke-opacity="0.18" stroke-width="2">
      <path d="M140 20 L200 40"/>
      <path d="M140 260 L200 220"/>
      <path d="M40 140 L20 200"/>
      <path d="M240 140 L260 200"/>
    </g>
  </g>

  <!-- title area -->
  <text x="78" y="96" fill="#9ff1e6" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="2">EDUCATIONAL · SIMULATION · VISUALIZATION</text>
  <text x="74" y="180" fill="#F5F9F8" font-family="Inter, Arial, Helvetica, sans-serif" font-size="64" font-weight="800" letter-spacing="-1">OSVision</text>
  <text x="78" y="220" fill="#cfeee6" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20">Interactive Operating Systems Simulator</text>

  <!-- small gantt bars under title -->
  <g transform="translate(78,248)">
    <rect x="0" y="0" width="520" height="18" rx="9" fill="#041b1b"/>
    <rect x="8" y="3" width="96" height="12" rx="6" fill="url(#accent)"/>
    <rect x="116" y="3" width="68" height="12" rx="6" fill="#0fb7a9" opacity="0.95"/>
    <rect x="196" y="3" width="180" height="12" rx="6" fill="#28d2bb" opacity="0.9"/>
    <rect x="388" y="3" width="40" height="12" rx="6" fill="#12b39a" opacity="0.85"/>
    <rect x="436" y="3" width="80" height="12" rx="6" fill="#0ea5a6" opacity="0.8"/>
  </g>

  <!-- left small badge -->
  <g transform="translate(960,26)">
    <rect x="0" y="0" width="180" height="64" rx="12" fill="#001219" opacity="0.18" />
    <text x="18" y="36" font-family="Inter, Arial, Helvetica, sans-serif" font-size="16" fill="#e6fff9">v1.0 • Demo</text>
  </g>

</svg>
